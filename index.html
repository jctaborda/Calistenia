<!DOCTYPE html>
<html lang="en" id="html-root">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calisthenics Mastery</title>
    <link rel="icon" href="assets/icons/favicon-32x32.png">
    <link rel="icon" sizes="192x192" href="assets/icons/favicon-192x192.png">
    <link rel="icon" sizes="512x512" href="assets/icons/favicon-512x512.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2D3250">
    
    <!-- Theme detection to prevent flash -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="loading">
    <!-- Global ARIA live regions for accessibility -->
    <div id="aria-live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="aria-live-assertive" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
    <main id="app"></main>
    <script type="module" src="./js/main.js"></script>
    <script>
      // Show content when CSS is loaded
      window.addEventListener('load', function() {
        document.body.classList.remove('loading');
      });
      
      // Fallback for browsers that don't support load event immediately
      setTimeout(function() {
        if (document.body.classList.contains('loading')) {
          document.body.classList.remove('loading');
        }
      }, 50);
    </script>
  </body>
</html>
